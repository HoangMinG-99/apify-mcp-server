# Techla Spa Apify Billing Bridge – read-only service for a controlled trial.
# This Blueprint lives at the repository root, but the app is isolated below.
# Secrets must be provided ONLY in the Render dashboard during deployment.
services:
  - type: web
    name: techla-apify-billing-mcp
    runtime: docker
    plan: free
    rootDir: techla-billing-bridge
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: MCP_ACCESS_TOKEN
        sync: false
      - key: APIFY_TOKEN_HUNG
        sync: false
      - key: APIFY_EXPECTED_USERNAME_HUNG
        sync: false
      - key: APIFY_LINK_ID_HUNG
        value: link_6adad6d22e048191a1bca6794aaaed6f
      - key: APIFY_ALLOW_PAID_USAGE
        value: "false"
